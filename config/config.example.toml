# ArborPress – Infrastruktur-Konfiguration
# Kopieren nach config/config.toml (empfohlen) oder config.toml
# und anpassen.  Geheimnisse NIE committen!
#
# Alle weiteren Einstellungen (Mail, Captcha, Kommentare, Federation,
# Suche, Theme) werden im Admin-Bereich unter /admin/settings verwaltet
# und in der Datenbank gespeichert.
#
# ---------------------------------------------------------------------------
# Empfohlenes Layout
# ---------------------------------------------------------------------------
#
#  Standalone (venv):
#       config/
#         config.toml      ← Hauptkonfiguration  (wird auto-gefunden)
#         secrets.toml     ← Passwörter, Secret-Keys  (chmod 600, .gitignore)
#
#  Docker:
#       Gleiches Layout, Volume mounten:
#         volumes:
#           - ./config:/app/config:ro
#
#  Alternativ – alles in einer Datei:
#       config.toml        (mit optionalem include = ["secrets.toml"])
#
#  Auto-Discover (ohne --config): sucht erst config/ dann config.toml im cwd.
#  Explizit: arborpress --config ./config/ serve
#
# ---------------------------------------------------------------------------
# include-Direktive
# ---------------------------------------------------------------------------
# include = ["secrets.toml"]    # relativ zur Hauptdatei – selber Ordner
#
# Includes können selbst wieder include-Direktiven enthalten (rekursiv).
# Inkludierte Werte überschreiben die Hauptdatei (Tabellen werden gemergt).
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Datenbank – PostgreSQL ≥16, MariaDB ≥11 oder SQLite (Entwicklung)
# ---------------------------------------------------------------------------
[db]
# PostgreSQL (empfohlen für Produktion):
url       = "postgresql+asyncpg://arborpress:passwort@localhost/arborpress"
# MariaDB:
# url     = "mysql+aiomysql://arborpress:passwort@localhost/arborpress"
# SQLite (nur Entwicklung):
# url     = "sqlite+aiosqlite:///./arborpress.db"
pool_size = 10
echo      = false

# ---------------------------------------------------------------------------
# Web & URL
# ---------------------------------------------------------------------------
[web]
host            = "127.0.0.1"
port            = 8066
secret_key      = "AENDERN_IM_PRODUKTIVBETRIEB_langer_zufaelliger_string"
# Public URL der Installation. WICHTIG: Hostname wird zur WebAuthn rp.id
# (W3C WebAuthn Level 3 §5.3) – ein Wechsel des registrierbaren Domain-
# Suffixes invalidiert ALLE bestehenden Passkeys. ArborPress sperrt einen
# stillen Wechsel ueber rp_id_locked und verlangt eine Bestaetigung in
# /admin/webauthn (oder per CLI: arborpress webauthn unlock-rp-id).
base_url        = "https://blog.example.com"
# Anzahl vertrauter Reverse-Proxy-Hops (0 = kein Proxy)
trusted_proxies = 1
# Pfad des Admin-Bereichs – konfigurierbar fuer Security-by-Obscurity
admin_path      = "/admin"

# ---------------------------------------------------------------------------
# Authentifizierung – Infrastruktur
# ---------------------------------------------------------------------------
# Wichtig: Die Passwort- und HIBP-Policy wird zur Laufzeit aus der DB
# (site_settings, Section "security") gelesen und ueber /admin/security
# gepflegt. Die Werte hier dienen nur als Bootstrap-Defaults beim ersten
# Start oder fuer CLI-Aktionen ohne DB.
# WebAuthn-Policy (UV/RK/Attestation/Algorithmen/Timeout/RP-ID-Lock)
# liegt komplett in site_settings (Section "webauthn", /admin/webauthn).
[auth]
# Benutzerverifikation (UV) global erzwingen
require_uv              = true
# Break-Glass Passwort-Login aktivieren (standardmaessig aus)
legacy_password_enabled = false
# Bootstrap-Defaults fuer die Passwort-Policy (DB ueberschreibt):
# Mindestlaenge fuer neue/aktualisierte Break-Glass Passwoerter.
# Empfehlung: 16 fuer normale Admin-Setups, 32 fuer strikte Umgebungen.
legacy_password_min_length = 16
# Obergrenze fuer Break-Glass Passwoerter. Hoch genug fuer Passphrasen,
# aber begrenzt, um Fehlbedienungen und Extremwerte zu vermeiden.
legacy_password_max_length = 128
# Mindestqualitaet via zxcvbn (0-4). Empfehlung: 3.
legacy_password_min_score = 3
# HIBP k-Anonymity-Pruefung (Have I Been Pwned, https://haveibeenpwned.com/API/v3#PwnedPasswords)
# Sendet nur die ersten 5 SHA-1-Hex-Zeichen, kein Klartext, keine Auth.
# Bootstrap-Defaults; DB-Werte gelten zur Laufzeit.
hibp_enabled    = false   # erst mit Opt-in aktiv (Datenschutz / DSGVO-Pruefung)
hibp_timeout    = 3.0     # Sekunden
hibp_fail_open  = true    # bei API-Ausfall Passwort akzeptieren statt blockieren
hibp_max_count  = 0       # 0 = jeder Treffer ist ein Treffer; >0 = Toleranzschwelle
# Step-up-Session TTL in Sekunden
stepup_ttl              = 900
# Admin-Session TTL in Sekunden
admin_session_ttl       = 3600
# Rate-Limit fuer Auth-Endpunkte
auth_rate_limit         = "10/minute"
# Dedizierter Key-Encryption-Key fuer ActivityPub Actor-Keypairs.
# Getrennt von secret_key – erlaubt session-Key-Rotation ohne Verlust der AP-Schluessel.
# Erstmalig generieren mit: arborpress federation kek-init
# Dann den ausgegebenen Wert hier eintragen:
# actor_key_enc_key = "<base64url-32-byte-wert>"

# ---------------------------------------------------------------------------
# SSO / OIDC (optional – ideal for kleine Teams hinter Reverse Proxy)
# ---------------------------------------------------------------------------
# Beispiel mit OpenID Connect Discovery:
# [sso.providers.company_sso]
# name           = "Firmen-Login"
# client_id      = "arborpress"
# client_secret  = "BITTE_AUS_SECRET_DATEI"
# discovery_url  = "https://sso.example.com/.well-known/openid-configuration"
# scopes         = ["openid", "profile", "email"]
# account_type   = "operational"   # neue Team-Konten standardmäßig intern
# auto_create    = true
# auto_link_by_email = true
# [sso.providers.company_sso.role_mapping]
# default        = "viewer"        # Rechte später gezielt in ArborPress erhöhen

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[logging]
level      = "INFO"
# file     = "/var/log/arborpress/app.log"   # optional
access_log = false
audit_log  = true
# audit_file = "/var/log/arborpress/audit.log"

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
[plugins]
# Verzeichnisse mit manuell installierten Plugins
dirs = [
    # "content/plugins/mein-plugin",
    # "/opt/arborpress/plugins",
]

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------
[cache]
# Backend: memory (default) | redis | valkey | memcached | file | none
backend = "memory"
# Standard-TTL in Sekunden
ttl     = 300
# Key-Präfix
prefix  = "ap:"

# Zwei-Ebenen-Cache: in-process L1 vor externem L2 (redis/valkey/memcached/file).
# Sinnvoll bei Multi-Worker-Deployments; kein Effekt wenn backend = "memory"/"none".
# l1_enabled = false
# l1_ttl     = 30   # L1-TTL in Sekunden (kürzer als ttl, damit L2-Updates greifen)

# Valkey – FOSS Redis-Fork (BSD-3, ab Redis 7.4 wechselte Redis zur BSL):
# backend   = "valkey"
# valkey_url = "valkey://localhost:6379/0"
# valkey_url = "valkeys://localhost:6380/0"   # TLS

# Redis (backend = "redis"):
# redis_url = "redis://localhost:6379/0"
# redis_url = "redis://:passwort@localhost:6379/0"
# redis_url = "rediss://localhost:6380/0"   # TLS

# Memcached (backend = "memcached"):
# memcached_host = "localhost"
# memcached_port = 11211

# Dateibasiert (backend = "file") – kein externer Dienst, persistent über Neustarts:
# file_dir = "/var/cache/arborpress"

# ---------------------------------------------------------------------------
# Federation / ActivityPub (im Admin-Bereich konfigurierbar)
# ---------------------------------------------------------------------------
# Für klassisches Blogging ist meist sinnvoll:
#   mode = "outgoing_only"
# Damit sind Actor/Outbox sichtbar, eingehende Interaktionen bleiben aber aus.
# Für volle Föderation erst später auf "full" stellen.
