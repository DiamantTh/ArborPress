[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "arborpress"
version = "0.1.0"
description = "Arbor Press – small, security-focused blogging platform / mini CMS"
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
authors = [
    { name = "ArborPress Contributors" }
]
dependencies = [
    # Klasse A – Kern/LTS-artig stabil halten (nur gezielte Major-Wechsel)
    # Web (ASGI)
    "quart>=0.20,<0.21",
    "hypercorn>=0.18,<0.19",
    # CLI
    "typer[all]>=0.15,<1.0",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.49,<2.1",
    "alembic>=1.19,<1.20",
    "asyncpg>=0.31,<1",           # PostgreSQL §12
    "aiomysql>=0.3,<1",           # MariaDB §12
    # Klasse B – regelmäßig patchen, innerhalb der getesteten Major-Linie
    # Auth / WebAuthn / Crypto
    "webauthn>=2.7,<3",           # §2
    "argon2-cffi>=25.1,<26",      # §2 break-glass
    "pyotp>=2.9,<3",              # TOTP/HOTP §3
    "zxcvbn>=4.5,<5",             # Passwortqualitaet fuer Break-Glass §2
    "cryptography>=46.0,<47",     # OpenPGP key ops §13
    # Content & Sanitization
    "bleach>=6.3,<7",              # §10 federated/user-content sanitization
    "python-slugify>=8.0,<9",      # §6 slug canonicalization
    "markdown-it-py>=4.0,<5",      # Markdown rendering §1
    "mdit-py-plugins>=0.5,<1",     # Markdown-Erweiterungen (Tasklists, Footnotes)
    # Media
    "pillow>=12.2,<13",           # image handling §1
    "aiofiles>=24.1,<26",         # async file I/O
    # Mail §13
    "aiosmtplib>=5.1,<6",         # py3.10+ baseline, aktuelle API
    # Rate-limiting §10
    "limits>=5.8,<6",
    # HTTP client (federation §5, OAuth2/OIDC §11)
    "httpx>=0.28,<0.29",
    # IDNA 2008 – Punycode für IDN-Domains (WebAuthn rp_id, SMTP-Host, §13)
    "idna>=3.11,<4",
    # E-Mail-Validierung: RFC 5321/5322 + IDNA 2008 (Unicode-Domains, §10)
    "email-validator>=2.2,<3",
    "dnspython>=2.7,<3",          # controlled A/MX/TLSA/CAA diagnostics for SMTP
    # Internationalization / translations
    "babel>=2.18,<3",             # gettext runtime + pybabel CLI (§7)
    # Config & version parsing
    # tomllib ist seit Python 3.11 Bestandteil der Standardbibliothek.
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "packaging>=25.0,<27",
]

[project.optional-dependencies]
 # Klasse C – nur bei Bedarf / Feature-Backends / optionale Integrationen
# SQLite-Backend (UX-Only / Demo – kein externer Datenbankserver nötig)
# Aktivieren mit: pip install ".[sqlite]"
# Containerfile: Build-Arg PIP_EXTRAS=sqlite
sqlite = [
    "aiosqlite>=0.20,<1",
]

# Optional Python binding for parallel BZip3 backup compression. The normal
# runtime and the default BZip2 backup path do not install or require it.
backup-bz3 = [
    "bzip3>=0.1.10,<0.2",
]

# WYSIWYG-Editor HTML→Markdown (optionaler Konverter für TipTap; nur für den
# tatsächlich ausgewählten Editor erforderlich).
wysiwyg = [
    "markdownify>=1.2,<2",
]
# Cache-Backends
cache-redis = [
    "redis[hiredis]>=5.0,<6",
]
# Valkey – FOSS Redis-Fork (BSD-3, API-kompatibel)
# Redis wechselte ab 7.4 zur BSL-Lizenz; Valkey ist der Community-Fork
cache-valkey = [
    "valkey[libvalkey]>=6.0,<7",
]
cache-memcached = [
    "aiomcache>=0.8,<1",
]
# GeoIP2 für Kommentar-Länderfilter (benötigt MaxMind GeoLite2-Country.mmdb)
# Aktivieren mit: pip install ".[geoip]"
geoip = [
    "geoip2>=4.8,<5",
]
# Externe FTS-Engines (optional, je nach Deployment)
search-meilisearch = [
    "meilisearch-python-sdk>=3.0,<4",
]
search-typesense = [
    "typesense>=0.21,<1",
]
search-elasticsearch = [
    "elasticsearch[async]>=8.0,<9",
]
# Alles auf einmal
all = [
    "aiosqlite>=0.20,<1",
    "redis[hiredis]>=5.0,<6",
    "valkey[libvalkey]>=6.0,<7",
    "aiomcache>=0.8,<1",
    "meilisearch-python-sdk>=3.0,<4",
    "typesense>=0.21,<1",
    "elasticsearch[async]>=8.0,<9",
    "markdownify>=1.2,<2",
    "geoip2>=4.8,<5",
]

[project.scripts]
arborpress = "arborpress.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "aiosqlite>=0.20,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

[tool.poetry]
packages = [{ include = "arborpress" }]
include = [
    { path = "arborpress/**/*.css", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.html", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.ini", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.json", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.js", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.mako", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.map", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.po", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.toml", format = ["sdist", "wheel"] },
    { path = "arborpress/**/*.txt", format = ["sdist", "wheel"] },
    { path = "arborpress/static/dist/.vite/manifest.json", format = ["sdist", "wheel"] },
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
