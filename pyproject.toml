[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arborpress"
version = "0.1.0"
description = "Arbor Press – small, security-focused blogging platform / mini CMS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "ArborPress Contributors" }
]
dependencies = [
    # Web (ASGI)
    "quart>=0.20",
    "hypercorn>=0.17",
    # CLI
    "typer[all]>=0.15",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.31",              # PostgreSQL §12
    "aiomysql>=0.3",              # MariaDB §12
    # Auth / WebAuthn / Crypto
    "webauthn>=2.5",              # §2
    "argon2-cffi>=25.1",          # §2 break-glass
    "pyotp>=2.9",                 # TOTP/HOTP §3
    "cryptography>=44.0",         # OpenPGP key ops §13
    # Content & Sanitization
    "bleach>=6.2",                # §10 federated/user-content sanitization
    "python-slugify>=8.0",        # §6 slug canonicalization
    "markdown-it-py>=4.0",        # Markdown rendering §1
    "mdit-py-plugins>=0.5",        # Markdown-Erweiterungen (Tasklists, Footnotes)
    # Media
    "pillow>=11.0",               # image handling §1
    "aiofiles>=24.1",             # async file I/O
    # Mail §13
    "aiosmtplib>=5.0",            # py3.10+ baseline, aktuelle API
    # Rate-limiting §10
    "limits>=5.0",
    # HTTP client (federation §5, OAuth2/OIDC §11)
    "httpx>=0.28",
    # IDNA 2008 – Punycode für IDN-Domains (WebAuthn rp_id, SMTP-Host, §13)
    "idna>=3.10",
    # E-Mail-Validierung: RFC 5321/5322 + IDNA 2008 (Unicode-Domains, §10)
    "email-validator>=2.2",
    # Config & version parsing
    # tomllib ist seit Python 3.11 Bestandteil der Standardbibliothek.
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "packaging>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",   # In-Memory-DB für Tests + SQLite-Backend allgemein
    "ruff>=0.4",
    "mypy>=1.10",
]
# WYSIWYG-Editor HTML→Markdown (optionaler Konverter für den TipTap/Prosemirror
# Adapter; wird nur genutzt wenn admin_editor != 'builtin')
wysiwyg = [
    "markdownify>=1.2",
]
# Cache-Backends
cache-redis = [
    "redis[hiredis]>=5.0",
]
# Valkey – FOSS Redis-Fork (BSD-3, API-kompatibel)
# Redis wechselte ab 7.4 zur BSL-Lizenz; Valkey ist der Community-Fork
cache-valkey = [
    "valkey[libvalkey]>=6.0",
]
cache-memcached = [
    "aiomcache>=0.8",
]
# Externe FTS-Engines (optional, je nach Deployment)
search-meilisearch = [
    "meilisearch-python-sdk>=3.0",
]
search-typesense = [
    "typesense>=0.21",
]
search-elasticsearch = [
    "elasticsearch[async]>=8.0",
]
# Alles auf einmal
all = [
    "aiosqlite>=0.20",
    "redis[hiredis]>=5.0",
    "valkey[libvalkey]>=6.0",
    "aiomcache>=0.8",
    "meilisearch-python-sdk>=3.0",
    "typesense>=0.21",
    "elasticsearch[async]>=8.0",
]

[project.scripts]
arborpress = "arborpress.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["arborpress"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
