# ArborPress Traefik-Hinweise
#
# Für Traefik reichen Labels und die wichtigsten Sicherheitsbausteine.
# Keine vollständigen dynamic/*.yml-Vhosts nötig.

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    # Automatischer HTTP→HTTPS-Redirect für alle Requests
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt   # Automatisches Zertifikat (ACME)
        domains:
          - main: "blog.example.com"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "admin@example.com"
      storage: "/etc/traefik/acme.json"
      httpChallenge:
        entryPoint: web

providers:
  file:
    directory: "/etc/traefik/dynamic"
    watch: true   # Änderungen ohne Neustart übernehmen


http:
  services:
    arborpress:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:5000"

        healthCheck:
          path: "/_health"         # ArborPress Health-Endpunkt (entrypoint.sh + _health route)
          interval: "30s"
          timeout: "5s"
          status: 200
  middlewares:
    arborpress-headers:
      headers:
        # Für ActivityPub korrekte Weiterleitung der Trust-Proxy-Info
        customRequestHeaders:
          X-Forwarded-Proto: "https"

    arborpress-ratelimit:
      rateLimit:
        average: 10    # 10 Requests pro Periode erlaubt
        period: "1m"   # Periode: 1 Minute
        burst: 5       # Burst: bis zu 5 Requests momentan überschreitbar

    arborpress-bodylimit:
      buffering:
        maxRequestBodyBytes: 52428800   # 50 MB

    arborpress-compress:
      compress: {}
  routers:
    arborpress-auth:
      entryPoints:
        - websecure
      rule: "Host(`blog.example.com`) && PathPrefix(`/auth/`)"
      middlewares:
        - arborpress-ratelimit
        - arborpress-headers
        - arborpress-compress
      service: arborpress
      tls:
        certResolver: letsencrypt
      priority: 20

    arborpress-default:
      entryPoints:
        - websecure
      rule: "Host(`blog.example.com`)"
      middlewares:
        - arborpress-headers
        - arborpress-bodylimit
        - arborpress-compress
      service: arborpress
      tls:
        certResolver: letsencrypt
      priority: 10

    # Für Docker/Compose reicht meist ein Label-Satz wie:
    #   traefik.enable=true
    #   traefik.http.routers.arborpress.rule=Host(`blog.example.com`)
    #   traefik.http.routers.arborpress.entrypoints=websecure
    #   traefik.http.routers.arborpress.tls.certresolver=letsencrypt
    #   traefik.http.services.arborpress.loadbalancer.server.port=5000
    #   traefik.http.routers.arborpress.middlewares=arborpress-headers@file
