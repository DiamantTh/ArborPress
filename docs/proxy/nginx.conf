# ArborPress nginx-Hinweise
#
# Nur die relevanten Sicherheitsblöcke, keine vollständigen vHosts.
# Für Traefik bitte Labels nutzen; für nginx reicht hier die Essenz:
#   - Redirect HTTP -> HTTPS
#   - Proxy-Header
#   - Sicherheits-/Client-Limits
#   - optionale Auth-Rate-Limits

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.example.com;

    ssl_certificate     /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    location /static/ {
        alias /path/to/arborpress/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ~ ^/(\.(well-known)/|ap/) {
        proxy_pass http://127.0.0.1:8066;
        proxy_pass_header Content-Type;
    }

    location / {
        proxy_pass http://127.0.0.1:8066;
    }
}

# Optional: http{}-scope limit_req_zone in a separate snippet file if desired.
