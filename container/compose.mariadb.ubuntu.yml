# ======================================================================
# ArborPress – Docker Compose  (Ubuntu 24.04 LTS + MariaDB 11.4 LTS)
# ======================================================================
#
# Genutzte Images:
#   App:  ubuntu:24.04 + CPython 3.14
#   DB:   mariadb:11.4            (MariaDB 11.4 LTS, EOL: Mai 2029)
#         Alternativ:  mariadb:11.8  (aktueller, non-LTS)
#
# Starten:    docker compose -f container/compose.mariadb.ubuntu.yml up -d
# Stoppen:    docker compose -f container/compose.mariadb.ubuntu.yml down
# Mit Daten:  docker compose -f container/compose.mariadb.ubuntu.yml down -v
#
# !! WICHTIGER HINWEIS – KEIN OS-WECHSEL IM BETRIEB !!
# -------------------------------------------------------
# Es existiert auch eine AlmaLinux-10-Variante (compose.mariadb.yml).
# Ein Wechsel zwischen Ubuntu und AlmaLinux auf einer laufenden Instanz
# wird AUSDRÜCKLICH NICHT empfohlen:
#
# 1) INSTANCE-VOLUME: beide Varianten persistieren /srv/arborpress/instance;
#    die Container-UID/GID-Zuordnung ist unterschiedlich.
#
# 2) MARIADB INNODB (kritisch!):
#    InnoDB-Tablespaces und Systemtabellen sind an die libc des jeweiligen
#    Container-Images gebunden. Ein roher Volume-Copy zwischen Ubuntu (glibc
#    Noble) und AlmaLinux (glibc EL10) führt zu Datenbankkorruption – auch bei
#    identischer MariaDB-Version.
#    Nicht getestet; verlasse dich NICHT darauf.
#
# SICHERER MIGRATIONSPFAD (immer, ohne Ausnahme):
#   mysqldump --single-transaction  →  mysql import
# ======================================================================

name: arborpress-mariadb-ubuntu

services:
  app:
    build:
      context: ..
      dockerfile: container/Containerfile.ubuntu
    restart: unless-stopped
    env_file: ../.env
    environment:
      ARBORPRESS_PREFIX: /srv/arborpress
      ARBORPRESS_DB__URL: "mysql+aiomysql://${MARIADB_USER}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE}"
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ARBORPRESS_PORT:-8066}:8066"
    volumes:
      - arborpress_instance:/srv/arborpress/instance
    healthcheck:
      test:
        - "CMD"
        - "python3.14"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8066/_health')"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    # Alternativ: mariadb:11.8
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  arborpress_instance:
  mariadb_data:
