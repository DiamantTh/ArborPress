# ======================================================================
# ArborPress – Portainer Stack  (PostgreSQL · Ubuntu 24.04 LTS)
# ======================================================================
#
# Verwendung in Portainer:
#   Stacks → Add Stack → Repository oder "Web editor"
#   Datei: container/compose.portainer.postgresql.yml
#
# Pflicht-Variablen (in Portainer unter "Environment variables" setzen):
#
#   ARBORPRESS_WEB__SECRET_KEY   Langer Zufallsstring ≥ 48 Zeichen
#                                  openssl rand -base64 48
#   ARBORPRESS_WEB__BASE_URL     Öffentliche URL, z. B. https://blog.example.com
#   POSTGRES_PASSWORD            Sicheres DB-Passwort für den App-User
#   POSTGRES_ROOT_PASSWORD       Sicheres Passwort für den superuser 'postgres'
#
# Optionale Variablen (Portainer zeigt Defaults in der UI):
#
#   ARBORPRESS_PORT              Host-Port (Standard: 8080)
#   POSTGRES_USER                DB-Benutzername (Standard: arborpress)
#   POSTGRES_DB                  Datenbankname (Standard: arborpress)
#   ARBORPRESS_WEB__TRUSTED_PROXIES  Proxy-Hops vor ArborPress (Standard: 1)
#   ARBORPRESS_WORKERS           Hypercorn-Worker (Standard: 2)
#   ARBORPRESS_LOGGING__LEVEL    DEBUG|INFO|WARNING|ERROR (Standard: INFO)
#
# ======================================================================

x-portainer:
  info:
    title: "ArborPress (PostgreSQL)"
    description: "Sicherheitsorientiertes Blog/CMS – App + PostgreSQL 17"
    categories:
      - CMS
      - Blog
    platform: linux
    note: >
      Vor dem Start ARBORPRESS_WEB__SECRET_KEY und POSTGRES_PASSWORD setzen.
      Beide Passwörter können mit `openssl rand -base64 48` generiert werden.

name: arborpress-portainer-postgresql

services:
  app:
    build:
      context: ..
      dockerfile: container/Containerfile.ubuntu
    restart: unless-stopped
    environment:
      # ── Pflichtfelder ─────────────────────────────────────────────
      ARBORPRESS_WEB__SECRET_KEY: "${ARBORPRESS_WEB__SECRET_KEY}"
      ARBORPRESS_WEB__BASE_URL:   "${ARBORPRESS_WEB__BASE_URL:-https://blog.example.com}"
      ARBORPRESS_DB__URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-arborpress}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arborpress}
      # ── Optionale Felder ──────────────────────────────────────────
      ARBORPRESS_WEB__TRUSTED_PROXIES: "${ARBORPRESS_WEB__TRUSTED_PROXIES:-1}"
      ARBORPRESS_WORKERS:              "${ARBORPRESS_WORKERS:-2}"
      ARBORPRESS_LOGGING__LEVEL:       "${ARBORPRESS_LOGGING__LEVEL:-INFO}"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ARBORPRESS_PORT:-8080}:8080"
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      # Config-Override einbinden (optional):
      # - ./arborpress-config:/app/config:ro
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_health')"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${POSTGRES_USER:-arborpress}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB:       "${POSTGRES_DB:-arborpress}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD"
        - "pg_isready"
        - "-U"
        - "${POSTGRES_USER:-arborpress}"
        - "-d"
        - "${POSTGRES_DB:-arborpress}"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  app_media:
  app_logs:
  pg_data:
