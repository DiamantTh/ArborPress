# ======================================================================
# ArborPress – Docker Compose  (AlmaLinux 10 + PostgreSQL)
# ======================================================================
#
# Genutzte Images:
#   App:  AlmaLinux 10 + CPython 3.13 (Source-Build aus Containerfile.ubi9)
#   DB:   postgres:17
#
# Starten:    docker compose -f container/compose.postgresql.yml up -d
# Stoppen:    docker compose -f container/compose.postgresql.yml down
# Mit Daten:  docker compose -f container/compose.postgresql.yml down -v
#
# !! WICHTIGER HINWEIS – KEIN OS-WECHSEL IM BETRIEB !!
# -------------------------------------------------------
# Es existiert auch eine Ubuntu-Variante (compose.postgresql.ubuntu.yml).
# Ein Wechsel zwischen AlmaLinux und Ubuntu auf einer laufenden Instanz
# wird AUSDRÜCKLICH NICHT empfohlen:
#
# 1) APP-VOLUMES: Pfade und UIDs unterscheiden sich:
#      AlmaLinux: /opt/app-root/src/media  /opt/app-root/src/logs  (UID 1001/GID 0)
#      Ubuntu:  /app/media  /app/logs                            (UID/GID 1001)
#
# 2) POSTGRESQL PGDATA (kritisch!):
#    PostgreSQL-PGDATA ist an die libc/locale des Container-Images gebunden.
#    Ein roher Volume-Copy zwischen AlmaLinux (glibc EL10) und Ubuntu (glibc Noble)
#    führt zu Datenbankkorruption – auch bei identischer PostgreSQL-Version.
#    Nicht getestet; verlasse dich NICHT darauf.
#
# SICHERER MIGRATIONSPFAD (immer, ohne Ausnahme):
#   pg_dump -Fc  →  pg_restore
# ======================================================================

name: arborpress-postgresql

services:
  app:
    build:
      context: ..
      dockerfile: container/Containerfile.ubi9
    restart: unless-stopped
    env_file: ../.env
    environment:
      ARBORPRESS_DB__URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ARBORPRESS_PORT:-8066}:8066"
    volumes:
      - app_media:/opt/app-root/src/media
      - app_logs:/opt/app-root/src/logs
      # Konfiguration einbinden (Verzeichnis oder Einzeldatei):
      # - ../config:/opt/app-root/src/config:ro
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8066/_health')"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - pg_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  app_media:
  app_logs:
  pg_data:
