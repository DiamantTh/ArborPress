# ======================================================================
# ArborPress – Portainer Stack  (MariaDB 11 · Ubuntu 24.04 LTS)
# ======================================================================
#
# Verwendung in Portainer:
#   Stacks → Add Stack → Repository oder "Web editor"
#   Datei: container/compose.portainer.mariadb.yml
#
# Pflicht-Variablen (in Portainer unter "Environment variables" setzen):
#
#   ARBORPRESS_WEB__SECRET_KEY   Langer Zufallsstring ≥ 48 Zeichen
#                                  openssl rand -base64 48
#   ARBORPRESS_WEB__BASE_URL     Öffentliche URL, z. B. https://blog.example.com
#   MARIADB_PASSWORD             Sicheres DB-Passwort für den App-User
#   MARIADB_ROOT_PASSWORD        Sicheres Root-Passwort für MariaDB
#
# Optionale Variablen (Portainer zeigt Defaults in der UI):
#
#   ARBORPRESS_PORT              Host-Port (Standard: 8066)
#   MARIADB_USER                 DB-Benutzername (Standard: arborpress)
#   MARIADB_DATABASE             Datenbankname (Standard: arborpress)
#   ARBORPRESS_WEB__TRUSTED_PROXIES  Proxy-Hops vor ArborPress (Standard: 1)
#   ARBORPRESS_WORKERS           Hypercorn-Worker (Standard: 2)
#   ARBORPRESS_LOGGING__LEVEL    DEBUG|INFO|WARNING|ERROR (Standard: INFO)
#
# ======================================================================

name: arborpress-portainer-mariadb

services:
  app:
    build:
      context: ..
      dockerfile: container/Containerfile.ubuntu
    restart: unless-stopped
    environment:
      # ── Pflichtfelder ─────────────────────────────────────────────
      ARBORPRESS_WEB__SECRET_KEY: "${ARBORPRESS_WEB__SECRET_KEY}"
      ARBORPRESS_WEB__BASE_URL:   "${ARBORPRESS_WEB__BASE_URL:-https://blog.example.com}"
      ARBORPRESS_DB__URL: >-
        mysql+aiomysql://${MARIADB_USER:-arborpress}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-arborpress}
      # ── Optionale Felder ──────────────────────────────────────────
      ARBORPRESS_WEB__TRUSTED_PROXIES: "${ARBORPRESS_WEB__TRUSTED_PROXIES:-1}"
      ARBORPRESS_WORKERS:              "${ARBORPRESS_WORKERS:-2}"
      ARBORPRESS_LOGGING__LEVEL:       "${ARBORPRESS_LOGGING__LEVEL:-INFO}"
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ARBORPRESS_PORT:-8066}:8066"
    volumes:
      - app_media:/app/media
      - app_logs:/app/logs
      # Config-Override einbinden (optional):
      # - ./arborpress-config:/app/config:ro
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8066/_health')"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER:          "${MARIADB_USER:-arborpress}"
      MARIADB_PASSWORD:      "${MARIADB_PASSWORD}"
      MARIADB_DATABASE:      "${MARIADB_DATABASE:-arborpress}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        - "CMD"
        - "healthcheck.sh"
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  app_media:
  app_logs:
  mariadb_data:
