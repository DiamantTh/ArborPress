name = 'Spring Mint'
version = '1.0.0'
type = "public"
author = 'ArborPress'
license = 'unknown'
description = 'Frühlingspalette in Minzgrün und Salbei.'
requires_theme_api = 1
dark_companion = 'spring-mint-dark'

capabilities = ["styles"]

[features]
dark_mode_toggle = false
code_highlight = true
reading_time = true
table_of_contents = true

[assets]
css = ['static/style.css']

[entry_points]
public_css = 'static/style.css'
