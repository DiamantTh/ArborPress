name = 'ArborPress Default'
version = '1.0.0'
type = "public"
author = 'ArborPress'
license = 'unknown'
description = 'Sauberes, modernes Blog-Layout – hell, lesefreundlich, responsiv.'
requires_theme_api = 1
dark_companion = 'dark'

capabilities = ["styles"]

[features]
dark_mode_toggle = false
code_highlight = true
reading_time = true
table_of_contents = true

[assets]
css = ['static/css/style.css']

[entry_points]
public_css = 'static/css/style.css'
