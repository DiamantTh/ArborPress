name = 'Spring Blossom'
version = '1.0.0'
type = "public"
author = 'ArborPress'
license = 'unknown'
description = 'Frühlingspalette mit Blütenrosa und warmen Neutraltönen.'
requires_arborpress = ">=0.1.0"
tested_with = "0.1.0"
dark_companion = 'spring-blossom-dark'

capabilities = ["styles"]

[features]
dark_mode_toggle = false
code_highlight = true
reading_time = true
table_of_contents = true

[assets]
css = ['static/style.css']

[entry_points]
public_css = 'static/style.css'
