name = 'Minimal Dark'
version = '1.0.0'
type = "public"
author = 'ArborPress'
license = 'unknown'
description = 'Dunkle Variante des Minimal-Themes – Zeitungsstil mit warmem Dunkelton und hellem Weinrot.'
